spring:
  codec:
    max-in-memory-size: 10MB
  datasource:
    # Railway는 DATABASE_URL 제공 (postgres://user:pass@host:port/db 형식)
    # Spring은 jdbc:postgresql:// 형식이 필요하므로 JDBC_DATABASE_URL 사용
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5433/scanops}
    username: ${JDBC_DATABASE_USERNAME:scanops}
    password: ${JDBC_DATABASE_PASSWORD:scanops}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

zap:
  host: ${ZAP_HOST:http://localhost:8090}
  api-key: ${ZAP_API_KEY:}

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: claude-sonnet-4-6
  gemini:
    api-key: ${GEMINI_API_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://*.vercel.app,https://*.up.railway.app}
