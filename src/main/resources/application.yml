spring:
  codec:
    max-in-memory-size: 10MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20       # scan-async(8) + poll(4) + API 요청 여유분
      minimum-idle: 5
      connection-timeout: 10000   # 10초 내 커넥션 못 얻으면 예외 (무한 대기 방지)
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false           # false여야 요청 종료 즉시 커넥션 반환
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: ${PORT:8080}

zap:
  host: ${ZAP_HOST:http://localhost:8090}
  api-key: ${ZAP_API_KEY:}
  timeout:
    spider-minutes: ${ZAP_SPIDER_TIMEOUT_MIN:10}      # 스파이더 최대 대기 시간 (분)
    active-scan-minutes: ${ZAP_ACTIVE_SCAN_TIMEOUT_MIN:60}  # 액티브 스캔 최대 대기 시간 (분)

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: claude-sonnet-4-6
  gemini:
    api-key: ${GEMINI_API_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://*.vercel.app,https://*.up.railway.app}

scanops:
  model:
    url: ${SCANOPS_MODEL_URL:http://localhost:8100}
  api-key: ${SCANOPS_API_KEY:}

github:
  app:
    id: ${GITHUB_APP_ID:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:}

logging:
  level:
    com.scanops.ai.AiRouter: ERROR
    com.scanops.vulnerability.VulnMetaMigrationService: WARN
