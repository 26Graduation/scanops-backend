spring:
  codec:
    max-in-memory-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/scanops}
    username: ${DB_USERNAME:scanops}
    password: ${DB_PASSWORD:scanops}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

zap:
  host: ${ZAP_HOST:http://localhost:8090}
  api-key: ${ZAP_API_KEY:scanops-local-key}

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: claude-sonnet-4-6
  gemini:
    api-key: ${GEMINI_API_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://*.vercel.app}
